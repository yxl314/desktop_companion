# cxx_ci/standardize 配置 —— desktop_companion（cxx-standardize 0.1.0 / cxx_ci 70dacb3）
#
# 在仓库根目录运行：
#     cxx-standardize --check
#     cxx-standardize --apply
# 未安装时可用：PYTHONPATH=<cxx_ci>/src python3 -m cxx_ci.standardize_tool --check
[standardize]
paths = ["src", "tests"]
# 第三方库与生成代码不参与排版检查。
exclude = ["third_party", "build", "dist", "ci-logs", "reports"]
build_dir = "build/standardize"
diff = "standardize.diff"
stage_dir = ".standardize"
auto_compile_commands = true
tidy = true
format = true
