# cxx_pkg 配置 —— desktop_companion（Windows MSYS2 ucrt64 + Qt6，自包含 zip）
[project]
name = desktop_companion
version = 1.0.0

[build]
system = cmake
source = .
build_dir = build/pkg
target = desktop_companion
cmake_args = -G Ninja -DCMAKE_BUILD_TYPE=Release

[package]
formats = zip
out_dir = dist
checksums = true

[qt]
enabled = auto
prefix = C:/msys2/ucrt64
# QML 源码目录：让 windeployqt 扫描 import，把 QtQuick/Controls 等模块打进包。
qmldir = qml
